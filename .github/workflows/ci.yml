name: CI

# The repository is public since 2026-10-02, so hosted minutes are free. The
# workflow runs on pull requests (not on drafts), on pushes to main,
# nightly and on demand; a newer push cancels the run of the older one, and a
# change that only touches docs runs nothing. It covers the matrix of the
# local CI: Linux GCC and Clang, the Python, JAX and reference tests against the
# pinned Pokemon Showdown, ASan+UBSan, TSan, MSVC, and on Windows GCC (with the
# Python and reference tests) and Clang. Since 2026-10-02 it is the merge gate
# (owner): a pull request is merged when every check on its head is green
# (docs/TESTING_AND_BENCHMARKS.md section 7). The local CI (tools/ci/local_ci.sh)
# stays for quick runs before a push, offline work and measurements.
on:
  # Every pull request, also one stacked on another branch: its merge with its
  # base gets the checks, so a stack is tested before it is retargeted.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  schedule:
    - cron: "17 3 * * *"
  # On demand, an intermediate state of a branch can run the quick profile:
  #   gh workflow run ci.yml --ref <branch> -f profile=quick
  # It runs Linux GCC Debug, Linux GCC ASan+UBSan and Windows GCC Debug with the
  # Python and reference tests; every other job shows as skipped (a job-level
  # `if`). Pull requests, pushes to main and the nightly run always run the full
  # matrix, and the merge gate stays the full matrix on the pull request's head.
  # Only for a branch without an open pull request: its checks land on the same
  # commit as the pull request's, so the job quick-guard fails such a run.
  workflow_dispatch:
    inputs:
      profile:
        description: "full: the whole matrix; quick: Linux GCC Debug, Linux GCC ASan+UBSan, Windows GCC Debug"
        type: choice
        options: [full, quick]
        default: full

permissions:
  contents: read

# One group per ref, event and profile: a newer push cancels the older run of the
# same kind, but a dispatch never cancels a push or nightly run (or the reverse).
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}-${{ inputs.profile || 'full' }}
  cancel-in-progress: true

jobs:
  # A quick run on a branch with an open pull request would put skipped checks
  # on the pull request's head commit beside the full run's: refused, red.
  quick-guard:
    name: Quick profile / no open pull request
    if: github.event_name == 'workflow_dispatch' && inputs.profile == 'quick'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: No open pull request from this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$GITHUB_REF_NAME" --state open --json number --jq 'map("#" + (.number | tostring)) | join(" ")')
          if [ -n "$open" ]; then
            echo "::error::profile=quick is for branches without an open pull request; $GITHUB_REF_NAME has $open. Its skipped jobs would sit on the pull request's head commit: run the full profile or rely on the pull request's own run."
            exit 1
          fi
          echo "no open pull request from $GITHUB_REF_NAME"

  # The Linux matrix is two jobs with the same steps because a job-level `if`
  # cannot see the matrix: GCC Debug runs in every profile, the Clang jobs not
  # in the quick one. The check names are those of the former single matrix.
  linux:
    name: Linux / ${{ matrix.cc }} / ${{ matrix.build_type }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: gcc, build_type: Debug }
    env:
      CC: ${{ matrix.cc }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (verified via git ls-remote 2026-09-30)
      - name: Toolchain versions
        run: |
          cmake --version
          "$CC" --version
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_TESTING=ON
          -DDUOFORGE_WARNINGS_AS_ERRORS=ON
          -DDUOFORGE_ENABLE_IPO=${{ matrix.build_type == 'Release' && 'ON' || 'OFF' }}
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error --timeout 120

  linux-clang:
    name: Linux / ${{ matrix.cc }} / ${{ matrix.build_type }}
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && inputs.profile != 'quick'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: clang, build_type: Debug }
          - { cc: clang, build_type: Release }
    env:
      CC: ${{ matrix.cc }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (verified via git ls-remote 2026-09-30)
      - name: Toolchain versions
        run: |
          cmake --version
          "$CC" --version
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_TESTING=ON
          -DDUOFORGE_WARNINGS_AS_ERRORS=ON
          -DDUOFORGE_ENABLE_IPO=${{ matrix.build_type == 'Release' && 'ON' || 'OFF' }}
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error --timeout 120

  # GCC Release with link-time optimization, as the local linux-gcc-release-ipo
  # job, plus everything the other jobs leave out: the Python package tests,
  # the learner's JAX test (CPU) and the reference tests against the pinned
  # Showdown (data regeneration, arithmetic, every committed battle trace, the
  # worker and the differential tools).
  #
  # The tests run in three parallel shards by CTest label (the learner's JAX tests alone took about 13 minutes each
  # and the single job about 53); the gate job joins the shard logs and checks that every test ran exactly once and
  # that no Python or reference test was skipped.
  linux-full:
    name: Linux / gcc / Release / Python, JAX, reference (${{ matrix.shard }})
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && inputs.profile != 'quick'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: learn, select: "-L '^learn$'" }
          - { shard: slow, select: "-L '^slow$' -LE '^learn$'" }
          - { shard: rest, select: "-LE '^(learn|slow)$'" }
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (verified via git ls-remote 2026-09-30)
      - name: Check out the pinned Pokemon Showdown
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (verified via git ls-remote 2026-09-30)
        with:
          repository: smogon/pokemon-showdown
          ref: b2cb775b0616115b775534eaeff50300e1fc81fc
          path: pokemon-showdown
          persist-credentials: false
      - name: Node 22 (the pin's engines field asks for >= 22.18)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0 (verified via git ls-remote 2026-10-02)
        with:
          node-version: "22"
      - name: Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 (verified via git ls-remote 2026-10-02)
        with:
          python-version: "3.12"
      - name: Build the pinned Showdown
        working-directory: pokemon-showdown
        run: |
          node --version
          npm ci --ignore-scripts --omit=dev
          node build
      - name: NumPy, JAX (CPU) and optax, at the learner's versions
        run: |
          python -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install --quiet numpy==2.5.3 jax==0.11.2 optax==0.2.8
          "$RUNNER_TEMP/py/bin/python" -c "import numpy, jax, optax; print(numpy.__version__, jax.__version__, optax.__version__, jax.devices())"
      - name: Toolchain versions
        run: |
          cmake --version
          "$CC" --version
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DDUOFORGE_WARNINGS_AS_ERRORS=ON
          -DDUOFORGE_ENABLE_IPO=ON
          -DPython3_EXECUTABLE="$RUNNER_TEMP/py/bin/python"
          -DDUOFORGE_PYTHON="$RUNNER_TEMP/py/bin/python"
          -DDUOFORGE_LEARN_PYTHON="$RUNNER_TEMP/py/bin/python"
          -DDUOFORGE_PS_REFERENCE_DIR="$GITHUB_WORKSPACE/pokemon-showdown"
      - name: Build
        run: cmake --build build --parallel 4
      - name: German locale (duoforge.cloud.numeric_locale)
        # The owner's machine runs de_DE.UTF-8, where printf and awk print 1,50; the runner has only C.UTF-8 and
        # en_US.UTF-8. ci-no-skip below turns a missing locale into a failure.
        run: |
          sudo locale-gen de_DE.UTF-8
          locale -a | grep -qx 'de_DE.utf8'
      - name: Test (${{ matrix.shard }})
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure --no-tests=error --timeout 120 --parallel 4 \
            ${{ matrix.select }} 2>&1 | tee "ctest-${{ matrix.shard }}.log"
      - name: Inventory
        if: always()
        run: ctest --test-dir build --show-only=json-v1 > "ctest-inventory-${{ matrix.shard }}.json"
      - name: Keep the shard log for the gate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (verified via git ls-remote 2026-10-23)
        with:
          name: linux-full-${{ matrix.shard }}
          path: |
            ctest-${{ matrix.shard }}.log
            ctest-inventory-${{ matrix.shard }}.json
          retention-days: 3

  linux-full-gate:
    name: Linux / gcc / Release / Python, JAX, reference
    # These tests report themselves skipped when their interpreter or checkout is missing; in the full job that is a
    # broken setup, not a pass. The shard logs are joined: every test of the inventory must have run exactly once.
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && inputs.profile != 'quick'
    needs: linux-full
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (verified via git ls-remote 2026-09-30)
      - name: Shard results
        run: test "${{ needs.linux-full.result }}" = success
      - name: Shard logs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0 (verified via git ls-remote 2026-10-23)
        with:
          pattern: linux-full-*
          merge-multiple: true
      - name: No Python or reference test skipped, every test ran once
        run: |
          cmp ctest-inventory-learn.json ctest-inventory-rest.json
          cmp ctest-inventory-slow.json ctest-inventory-rest.json
          cat ctest-learn.log ctest-slow.log ctest-rest.log > ctest.log
          python tools/ci/check_ctest_labels.py \
            --inventory ctest-inventory-rest.json --log ctest.log \
            --no-skip-label ci-no-skip --present-label ci-linux-proof \
            --present-count 25 --nonempty-label ci-ps-trace --require-all

  linux-sanitizers:
    name: Linux / gcc / ASan+UBSan
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CC: gcc
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (verified via git ls-remote 2026-09-30)
      - name: Toolchain versions
        run: |
          cmake --version
          "$CC" --version
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DDUOFORGE_ENABLE_SANITIZERS=ON
          -DDUOFORGE_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error --timeout 120

  linux-tsan:
    name: Linux / clang / TSan
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && inputs.profile != 'quick'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CC: clang
      CXX: clang++
      TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (verified via git ls-remote 2026-09-30)
      - name: Toolchain versions
        run: |
          cmake --version
          "$CC" --version
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_TESTING=ON
          -DDUOFORGE_ENABLE_TSAN=ON
          -DDUOFORGE_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        # setarch -R: ThreadSanitizer cannot map its shadow memory under the
        # runner kernel's full address-space randomization.
        run: setarch "$(uname -m)" -R ctest --test-dir build --output-on-failure --no-tests=error --timeout 300 -L '^ci-tsan$'

  windows:
    name: Windows / MSVC / ${{ matrix.arch }} / ${{ matrix.config }}
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && inputs.profile != 'quick'
    runs-on: windows-latest
    # 20 minutes ran out on x64 Release (IPO build + serial ctest) once the
    # suite grew past 1500 tests (2026-10-16: cancelled on #622, #624 and #625)
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # Pull requests run x64 Release only (the strictest MSVC build: /W4 /WX, IPO, the export link test); x64 Debug
      # and Win32 Release run on every push to main and in the nightly run (owner, 2026-10-23).
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"arch":"x64","config":"Release","bits":64}]'
          || '[{"arch":"x64","config":"Release","bits":64},{"arch":"x64","config":"Debug","bits":64},{"arch":"Win32","config":"Release","bits":32}]') }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (verified via git ls-remote 2026-09-30)
      - name: Toolchain versions
        run: cmake --version
      - name: Configure
        run: >-
          cmake -S . -B build -A ${{ matrix.arch }}
          -DBUILD_TESTING=ON
          -DDUOFORGE_WARNINGS_AS_ERRORS=ON
          -DDUOFORGE_ENABLE_IPO=${{ matrix.arch == 'x64' && matrix.config == 'Release' && 'ON' || 'OFF' }}
      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel 4
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure --no-tests=error --timeout 120
      - name: Python for synthetic integer graph parity
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 (verified via git ls-remote 2026-10-02)
        with:
          python-version: "3.12"
      - name: Synthetic graph oracle dependency
        run: python -m pip install --quiet numpy==2.5.3
      - name: Synthetic integer graph parity
        shell: bash
        run: |
          for graph in full small medium; do
            python tools/eval/tests/graph_oracle.py "build/tests/${{ matrix.config }}/duoforge_eval_graphs.exe" "$graph"
          done
          python tools/eval/tests/graph_arithmetic_oracle.py "build/tests/${{ matrix.config }}/duoforge_eval_graphs.exe"
      - name: Check tested bitness
        shell: bash
        run: |
          ctest --test-dir build -C ${{ matrix.config }} -L '^ci-msvc-smoke$' -V > smoke.log
          grep "pointer_bits=${{ matrix.bits }} " smoke.log

  # MinGW GCC Debug with the Python package tests and every reference test on
  # Windows, as the local win-gcc-debug job: line endings, paths and the
  # Windows Node and Python meet the same traces as on Linux. The learner's
  # JAX test runs only on Linux (linux-full), as locally.
  windows-gcc-full:
    name: Windows / gcc / Debug / Python, reference
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (verified via git ls-remote 2026-09-30)
      - name: Check out the pinned Pokemon Showdown
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (verified via git ls-remote 2026-09-30)
        with:
          repository: smogon/pokemon-showdown
          ref: b2cb775b0616115b775534eaeff50300e1fc81fc
          path: pokemon-showdown
          persist-credentials: false
      - name: MinGW-w64 GCC and Ninja (MSYS2 UCRT64)
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0 (verified via git ls-remote 2026-10-02)
        with:
          msystem: UCRT64
          release: false
          update: false
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-ninja
      - name: Node 22 (the pin's engines field asks for >= 22.18)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0 (verified via git ls-remote 2026-10-02)
        with:
          node-version: "22"
      - name: Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 (verified via git ls-remote 2026-10-02)
        with:
          python-version: "3.12"
      - name: Put the UCRT64 toolchain first on PATH, install NumPy
        run: |
          echo "C:/msys64/ucrt64/bin" >> "$GITHUB_PATH"
          python -m pip install --quiet numpy==2.5.3
      - name: Build the pinned Showdown
        working-directory: pokemon-showdown
        run: |
          node --version
          npm ci --ignore-scripts --omit=dev
          node build
      - name: Toolchain versions
        run: |
          cmake --version
          gcc --version
          ninja --version
      - name: Configure
        run: |
          py="$(cygpath -m "$pythonLocation")/python.exe"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DBUILD_TESTING=ON -DDUOFORGE_WARNINGS_AS_ERRORS=ON \
            -DPython3_EXECUTABLE="$py" -DDUOFORGE_PYTHON="$py" \
            -DDUOFORGE_PS_REFERENCE_DIR="$(cygpath -m "$GITHUB_WORKSPACE")/pokemon-showdown"
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error --timeout 120 --parallel 4 2>&1 | tee ctest.log
      - name: No Python or reference test skipped (the JAX tests are Linux-only)
        run: |
          ctest --test-dir build --show-only=json-v1 > "$RUNNER_TEMP/ctest-inventory.json"
          python tools/ci/check_ctest_labels.py \
            --inventory "$RUNNER_TEMP/ctest-inventory.json" --log ctest.log \
            --no-skip-label ci-no-skip --exclude-label requires-jax \
            --present-label ci-windows-proof --present-count 1 --nonempty-label ci-ps-trace

  windows-gcc-release-ipo:
    name: Windows / gcc / Release / IPO
    # Not on pull requests: every push to main and the nightly run (owner, 2026-10-23).
    if: github.event_name != 'pull_request' && inputs.profile != 'quick'
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (verified via git ls-remote 2026-09-30)
      - name: MinGW-w64 GCC and Ninja (MSYS2 UCRT64)
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0 (verified via git ls-remote 2026-10-02)
        with:
          msystem: UCRT64
          release: false
          update: false
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-ninja
      - name: Put the UCRT64 toolchain first on PATH
        run: echo "C:/msys64/ucrt64/bin" >> "$GITHUB_PATH"
      - name: Toolchain versions
        run: |
          cmake --version
          gcc --version
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          -DBUILD_TESTING=ON -DDUOFORGE_WARNINGS_AS_ERRORS=ON -DDUOFORGE_ENABLE_IPO=ON
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error --timeout 120

  windows-clang:
    name: Windows / clang / Release
    # Not on pull requests: every push to main and the nightly run (owner, 2026-10-23).
    if: github.event_name != 'pull_request' && inputs.profile != 'quick'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (verified via git ls-remote 2026-09-30)
      - name: Python 3.12 (for Ninja)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 (verified via git ls-remote 2026-10-02)
        with:
          python-version: "3.12"
      - name: Ninja
        run: python -m pip install --quiet ninja
      - name: Toolchain versions
        run: |
          cmake --version
          "C:/Program Files/LLVM/bin/clang.exe" --version
          ninja --version
      - name: Configure
        # The runner's LLVM, MSVC target, as the local win-clang-release job.
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER="C:/Program Files/LLVM/bin/clang.exe"
          -DCMAKE_CXX_COMPILER="C:/Program Files/LLVM/bin/clang++.exe"
          -DCMAKE_RC_COMPILER="C:/Program Files/LLVM/bin/llvm-rc.exe"
          -DBUILD_TESTING=ON -DDUOFORGE_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error --timeout 120
      - name: Synthetic graph oracle dependency
        run: python -m pip install --quiet numpy==2.5.3
      - name: Synthetic integer graph parity
        run: |
          for graph in full small medium; do
            python tools/eval/tests/graph_oracle.py build/tests/duoforge_eval_graphs.exe "$graph"
          done
          python tools/eval/tests/graph_arithmetic_oracle.py build/tests/duoforge_eval_graphs.exe
