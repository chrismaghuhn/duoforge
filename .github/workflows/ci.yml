name: CI

# The repository is public since 2026-10-02, so hosted minutes are free. The
# workflow runs on pull requests (not on drafts), on pushes to main,
# nightly and on demand; a newer push cancels the run of the older one, and a
# change that only touches docs runs nothing. It covers the matrix of the
# local CI: Linux GCC and Clang, the Python, JAX and reference tests against the
# pinned Pokemon Showdown, ASan+UBSan, TSan, MSVC, and on Windows GCC (with the
# Python and reference tests) and Clang. Since 2026-10-02 it is the merge gate
# (owner): a pull request is merged when every check on its head is green
# (docs/TESTING_AND_BENCHMARKS.md section 7). The local CI (tools/ci/local_ci.sh)
# stays for quick runs before a push, offline work and measurements.
on:
  # Every pull request, also one stacked on another branch: its merge with its
  # base gets the checks, so a stack is tested before it is retargeted.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / ${{ matrix.cc }} / ${{ matrix.build_type }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: gcc, build_type: Debug }
          - { cc: clang, build_type: Debug }
          - { cc: clang, build_type: Release }
    env:
      CC: ${{ matrix.cc }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (verified via git ls-remote 2026-09-30)
      - name: Toolchain versions
        run: |
          cmake --version
          "$CC" --version
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_TESTING=ON
          -DDUOFORGE_WARNINGS_AS_ERRORS=ON
          -DDUOFORGE_ENABLE_IPO=${{ matrix.build_type == 'Release' && 'ON' || 'OFF' }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error --timeout 120

  # GCC Release with link-time optimization, as the local linux-gcc-release-ipo
  # job, plus everything the other jobs leave out: the Python package tests,
  # the learner's JAX test (CPU) and the reference tests against the pinned
  # Showdown (data regeneration, arithmetic, every committed battle trace, the
  # worker and the differential tools).
  linux-full:
    name: Linux / gcc / Release / Python, JAX, reference
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (verified via git ls-remote 2026-09-30)
      - name: Check out the pinned Pokemon Showdown
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (verified via git ls-remote 2026-09-30)
        with:
          repository: smogon/pokemon-showdown
          ref: b2cb775b0616115b775534eaeff50300e1fc81fc
          path: pokemon-showdown
          persist-credentials: false
      - name: Node 22 (the pin's engines field asks for >= 22.18)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0 (verified via git ls-remote 2026-10-02)
        with:
          node-version: "22"
      - name: Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 (verified via git ls-remote 2026-10-02)
        with:
          python-version: "3.12"
      - name: Build the pinned Showdown
        working-directory: pokemon-showdown
        run: |
          node --version
          npm ci --ignore-scripts --omit=dev
          node build
      - name: NumPy, JAX (CPU) and optax, at the learner's versions
        run: |
          python -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install --quiet numpy==2.5.3 jax==0.11.2 optax==0.2.8
          "$RUNNER_TEMP/py/bin/python" -c "import numpy, jax, optax; print(numpy.__version__, jax.__version__, optax.__version__, jax.devices())"
      - name: Toolchain versions
        run: |
          cmake --version
          "$CC" --version
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DDUOFORGE_WARNINGS_AS_ERRORS=ON
          -DDUOFORGE_ENABLE_IPO=ON
          -DPython3_EXECUTABLE="$RUNNER_TEMP/py/bin/python"
          -DDUOFORGE_PYTHON="$RUNNER_TEMP/py/bin/python"
          -DDUOFORGE_LEARN_PYTHON="$RUNNER_TEMP/py/bin/python"
          -DDUOFORGE_PS_REFERENCE_DIR="$GITHUB_WORKSPACE/pokemon-showdown"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error --timeout 120 --parallel 4 2>&1 | tee ctest.log
      - name: No Python or reference test skipped
        # These tests report themselves skipped when their interpreter or
        # checkout is missing; in this job that is a broken setup, not a pass.
        run: |
          if grep -E '\*\*\*Skipped' ctest.log | grep -E 'duoforge\.(python|reference)\.'; then
            echo "Python or reference tests were skipped"
            exit 1
          fi
          grep -c -E 'Test +#[0-9]+: duoforge\.reference\.trace\.' ctest.log
          grep -E 'Test +#[0-9]+: duoforge\.python\.learn ' ctest.log

  linux-sanitizers:
    name: Linux / gcc / ASan+UBSan
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CC: gcc
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (verified via git ls-remote 2026-09-30)
      - name: Toolchain versions
        run: |
          cmake --version
          "$CC" --version
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DDUOFORGE_ENABLE_SANITIZERS=ON
          -DDUOFORGE_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error --timeout 120

  linux-tsan:
    name: Linux / clang / TSan
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CC: clang
      CXX: clang++
      TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (verified via git ls-remote 2026-09-30)
      - name: Toolchain versions
        run: |
          cmake --version
          "$CC" --version
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_TESTING=ON
          -DDUOFORGE_ENABLE_TSAN=ON
          -DDUOFORGE_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        # setarch -R: ThreadSanitizer cannot map its shadow memory under the
        # runner kernel's full address-space randomization.
        run: setarch "$(uname -m)" -R ctest --test-dir build --output-on-failure --no-tests=error --timeout 300 -R "duoforge\\.batch\\."

  windows:
    name: Windows / MSVC / ${{ matrix.arch }} / ${{ matrix.config }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, config: Release, bits: 64 }
          - { arch: x64, config: Debug, bits: 64 }
          - { arch: Win32, config: Release, bits: 32 }
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (verified via git ls-remote 2026-09-30)
      - name: Toolchain versions
        run: cmake --version
      - name: Configure
        run: >-
          cmake -S . -B build -A ${{ matrix.arch }}
          -DBUILD_TESTING=ON
          -DDUOFORGE_WARNINGS_AS_ERRORS=ON
          -DDUOFORGE_ENABLE_IPO=${{ matrix.arch == 'x64' && matrix.config == 'Release' && 'ON' || 'OFF' }}
      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure --no-tests=error --timeout 120
      - name: Check tested bitness
        shell: bash
        run: |
          ctest --test-dir build -C ${{ matrix.config }} -R '^duoforge_smoke_test$' -V > smoke.log
          grep "pointer_bits=${{ matrix.bits }} " smoke.log

  # MinGW GCC Debug with the Python package tests and every reference test on
  # Windows, as the local win-gcc-debug job: line endings, paths and the
  # Windows Node and Python meet the same traces as on Linux. The learner's
  # JAX test runs only on Linux (linux-full), as locally.
  windows-gcc-full:
    name: Windows / gcc / Debug / Python, reference
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (verified via git ls-remote 2026-09-30)
      - name: Check out the pinned Pokemon Showdown
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (verified via git ls-remote 2026-09-30)
        with:
          repository: smogon/pokemon-showdown
          ref: b2cb775b0616115b775534eaeff50300e1fc81fc
          path: pokemon-showdown
          persist-credentials: false
      - name: MinGW-w64 GCC and Ninja (MSYS2 UCRT64)
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0 (verified via git ls-remote 2026-10-02)
        with:
          msystem: UCRT64
          release: false
          update: false
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-ninja
      - name: Node 22 (the pin's engines field asks for >= 22.18)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0 (verified via git ls-remote 2026-10-02)
        with:
          node-version: "22"
      - name: Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 (verified via git ls-remote 2026-10-02)
        with:
          python-version: "3.12"
      - name: Put the UCRT64 toolchain first on PATH, install NumPy
        run: |
          echo "C:/msys64/ucrt64/bin" >> "$GITHUB_PATH"
          python -m pip install --quiet numpy==2.5.3
      - name: Build the pinned Showdown
        working-directory: pokemon-showdown
        run: |
          node --version
          npm ci --ignore-scripts --omit=dev
          node build
      - name: Toolchain versions
        run: |
          cmake --version
          gcc --version
          ninja --version
      - name: Configure
        run: |
          py="$(cygpath -m "$pythonLocation")/python.exe"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DBUILD_TESTING=ON -DDUOFORGE_WARNINGS_AS_ERRORS=ON \
            -DPython3_EXECUTABLE="$py" -DDUOFORGE_PYTHON="$py" \
            -DDUOFORGE_PS_REFERENCE_DIR="$(cygpath -m "$GITHUB_WORKSPACE")/pokemon-showdown"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error --timeout 120 --parallel 4 2>&1 | tee ctest.log
      - name: No Python or reference test skipped (the JAX test is Linux-only)
        run: |
          if grep -E '\*\*\*Skipped' ctest.log | grep -E 'duoforge\.(python|reference)\.' | grep -v 'duoforge\.python\.learn '; then
            echo "Python or reference tests were skipped"
            exit 1
          fi
          grep -c -E 'Test +#[0-9]+: duoforge\.reference\.trace\.' ctest.log

  windows-gcc-release-ipo:
    name: Windows / gcc / Release / IPO
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (verified via git ls-remote 2026-09-30)
      - name: MinGW-w64 GCC and Ninja (MSYS2 UCRT64)
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0 (verified via git ls-remote 2026-10-02)
        with:
          msystem: UCRT64
          release: false
          update: false
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-ninja
      - name: Put the UCRT64 toolchain first on PATH
        run: echo "C:/msys64/ucrt64/bin" >> "$GITHUB_PATH"
      - name: Toolchain versions
        run: |
          cmake --version
          gcc --version
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          -DBUILD_TESTING=ON -DDUOFORGE_WARNINGS_AS_ERRORS=ON -DDUOFORGE_ENABLE_IPO=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error --timeout 120

  windows-clang:
    name: Windows / clang / Release
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (verified via git ls-remote 2026-09-30)
      - name: Python 3.12 (for Ninja)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 (verified via git ls-remote 2026-10-02)
        with:
          python-version: "3.12"
      - name: Ninja
        run: python -m pip install --quiet ninja
      - name: Toolchain versions
        run: |
          cmake --version
          "C:/Program Files/LLVM/bin/clang.exe" --version
          ninja --version
      - name: Configure
        # The runner's LLVM, MSVC target, as the local win-clang-release job.
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER="C:/Program Files/LLVM/bin/clang.exe"
          -DCMAKE_CXX_COMPILER="C:/Program Files/LLVM/bin/clang++.exe"
          -DCMAKE_RC_COMPILER="C:/Program Files/LLVM/bin/llvm-rc.exe"
          -DBUILD_TESTING=ON -DDUOFORGE_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error --timeout 120
